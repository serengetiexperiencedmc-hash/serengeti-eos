openapi: 3.1.0
info:
  title: Serengeti EOS CRM API (C1)
  version: "1.0.0"
  description: |
    CRM bounded context — Increment C1 (`/v1/crm/*`).
    Development/Testing only. Not production-ready.
    Authentication: bearer token (local IdP in Development).
    Optimistic concurrency: `If-Match` header (entity version integer) on PATCH where noted.
    Idempotency: `Idempotency-Key` header required on merge execute and import execute.
servers:
  - url: "http://127.0.0.1:8080"
    description: Local Development
tags:
  - name: Health
    description: Module health (Dev/Test)
  - name: Dev
    description: Development/Testing diagnostics only
  - name: Catalogues
  - name: Organizations
  - name: OrganizationUnits
  - name: Contacts
  - name: Relationships
  - name: Activities
  - name: Accounts
  - name: Notes
  - name: Tasks
  - name: Search
  - name: Duplicates
  - name: Merges
  - name: Imports
  - name: Tags
  - name: TagAssignments
  - name: ExternalIdentifiers
paths:
  /v1/crm/health:
    get:
      tags:
        - Health
      security:
        - bearerAuth: []
      summary: CRM module health (Dev/Test only)
      description: Returns CRM module metadata and entity counts. Requires authentication only.
      responses:
        200:
          description: Module health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CrmModuleHealth"
        400:
          $ref: "#/components/responses/BadRequest"
        401:
          $ref: "#/components/responses/Unauthorized"
        403:
          $ref: "#/components/responses/Forbidden"
        404:
          $ref: "#/components/responses/NotFound"
        409:
          $ref: "#/components/responses/Conflict"
  /v1/crm/dev/outbox-events:
    get:
      tags:
        - Dev
      security:
        - bearerAuth: []
      summary: List CRM outbox events (Dev/Test only)
      description: "Requires `events:read:operations` permission."
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        200:
          description: Recent CRM outbox events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutboxEventList"
        400:
          $ref: "#/components/responses/BadRequest"
        401:
          $ref: "#/components/responses/Unauthorized"
        403:
          $ref: "#/components/responses/Forbidden"
        404:
          $ref: "#/components/responses/NotFound"
        409:
          $ref: "#/components/responses/Conflict"
  /v1/crm/organization-types:
    get:
      tags:
        - Catalogues
      security:
        - bearerAuth: []
      summary: List organization types
      description: "Requires `crm:read:organization` permission."
      responses:
        200:
          description: Catalogue items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogueList"
        400:
          $ref: "#/components/responses/BadRequest"
        401:
          $ref: "#/components/responses/Unauthorized"
        403:
