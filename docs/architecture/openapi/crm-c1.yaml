components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrgId:
      name: orgId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Organization UUID
    IfMatch:
      name: If-Match
      in: header
      required: false
      schema:
        type: integer
      description: Expected entity version for optimistic concurrency
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
      description: Client-supplied idempotency key
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
    SystemKey:
      name: systemKey
      in: path
      required: true
      schema:
        type: string
    ExternalId:
      name: externalId
      in: path
      required: true
      schema:
        type: string
  responses:
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UnauthenticatedError"
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CrmError"
    Forbidden:
      description: Authorization denied
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CrmError"
    NotFound:
      description: Resource not found or not visible
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CrmError"
    Conflict:
      description: Conflict (version mismatch, duplicate, invalid state)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CrmError"
  schemas:
    UnauthenticatedError:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          enum:
            - unauthenticated
    CrmError:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          enum:
            - invalid_request
            - forbidden
            - not_found
            - conflict
        reason:
          type: string
    Classification:
      type: string
      enum:
        - Public
        - Internal
        - Confidential
        - Restricted
        - HighlyRestricted
    CatalogueType:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        key:
          type: string
        label:
          type: string
        active:
          type: boolean
    CatalogueList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CatalogueType"
    CrmModuleHealth:
      type: object
      properties:
        module:
          type: string
          enum:
            - crm
        increment:
          type: string
        environment:
          type: string
          enum:
            - Development/Test
        productionReady:
          type: boolean
          enum:
            - false
        entities:
          type: object
          additionalProperties:
            type: integer
        note:
          type: string
    OutboxEventList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            type: object
    Organization:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        legalName:
          type: string
        tradingName:
          type: string
        organizationTypeId:
          type: string
          format: uuid
        country:
          type: string
        region:
          type: string
        market:
          type: string
        website:
          type: string
        domain:
          type: string
        primaryEmail:
          type: string
        primaryTelephone:
          type: string
        address:
          type: object
          additionalProperties: true
        status:
          type: string
          enum:
            - Prospect
            - Engaged
            - Qualified
            - Active
            - Dormant
            - Disqualified
            - Archived
        dataQualityStatus:
          type: string
        classification:
          $ref: "#/components/schemas/Classification"
        ownerPrincipalId:
          type: string
          format: uuid
        source:
          type: string
        version:
          type: integer
        mergedIntoId:
          type: string
          format: uuid
        archivedAt:
